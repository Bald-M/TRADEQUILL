name: 功能建议
description: 提议一个符合 TradeQuill 本地优先桌面产品边界的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。TradeQuill 第一版是 Windows/macOS 本地优先的个人外贸桌面应用，不包含 AI、云同步或遥测；较大的业务模型或架构调整需要先明确范围和验收条件。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景、当前做法和阻碍，不要只写解决方案名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 说明期望交互、输入、输出和完成后的用户可见结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明当前临时做法或其他可选方案，以及它们为何不足。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与兼容性
      description: 说明是否影响 Windows/macOS、SQLite schema、Rust IPC、导入导出、通知、界面或现有数据。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可验证的清单描述何时算完成，并注明需要的真实桌面验证。
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索已有 Issue。
          required: true
        - label: 我已区分浏览器预览与真实桌面验收，不会用前者替代后者。
          required: true
        - label: 建议保持个人单机、本地优先、无 AI、无云同步和无遥测边界，或已明确说明需要讨论的例外。
          required: true
